openapi: 3.0.0
info:
  version: 1.0.0
  title: Health Tracker API
  description: This API provides endpoints for handling CRUD operations on the Health Tracker data.
  contact:
    name: Yufan Liu
    email: 20120213@setu.ie

paths:
  /api/users:
    get:
      responses:
        200:
          description: This is a list of the users in the app
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'

    post:
      description: Add a new user to the app
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      responses:
        201:
          description: This is the user that was added to the app
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /api/users/{user-id}:
    get:
      parameters:
        - $ref: '#/components/parameters/UserIdPath'
      responses:
        200:
          description: This is the user with the specified ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
    delete:
      parameters:
        - $ref: '#/components/parameters/UserIdPath'
      responses:
        204:
          description: This is the user that was deleted from the app
#          content:
#            application/json:
#              schema:
#                $ref: '#/components/schemas/User'
    patch:
      parameters:
        - $ref: '#/components/parameters/UserIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      responses:
        200:
          description: This is the user that was updated in the app
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /api/users/{user-id}/activities:
    get:
      parameters:
        - $ref: '#/components/parameters/UserIdPath'
      responses:
        200:
          description: This is a list of the activities for the user with the specified ID
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Activity'
    delete:
      parameters:
        - $ref: '#/components/parameters/UserIdPath'
      responses:
        204:
          description: User activities deleted successfully

  /api/users/email/{email}:
    get:
      parameters:
        - name: email
          in: path
          description: User email path parameter
          required: true
          schema:
            type: string
            example: example@gmail.com
      responses:
        200:
          description: This is the user with the specified email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /api/activities:
    get:
      responses:
        200:
          description: This is a list of all activities in the app
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Activity'
    post:
      description: Add a new activity to the app
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Activity'
      responses:
        201:
          description: This is the activity that was added to the app
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activity'

  /api/activities/{activity-id}:
    get:
      parameters:
        - name: activity-id
          in: path
          description: Activity ID path parameter
          required: true
          schema:
            type: integer
            example: 1
      responses:
        200:
          description: This is the activity with the specified ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activity'
    delete:
      parameters:
        - name: activity-id
          in: path
          description: Activity ID path parameter
          required: true
          schema:
            type: integer
            example: 1
      responses:
        204:
          description: Activity deleted successfully
    patch:
      parameters:
        - name: activity-id
          in: path
          description: Activity ID path parameter
          required: true
          schema:
            type: integer
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Activity'
      responses:
        200:
          description: This is the activity that was updated in the app
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activity'

components:
  parameters:
    UserIdPath:
      name: user-id
      in: path
      description: User ID path parameter
      required: true
      schema:
        type: integer
        example: 3232
  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
          example: 3232
        name:
          type: string
          example: Joe Soap
        email:
          type: string
          example: joe@soap.com

    Activity:
      type: object
      required:
        - id
        - description
        - duration
        - calories
        - started
        - userId
      properties:
        id:
          type: integer
          example: 1
        description:
          type: string
          maxLength: 100
          example: Running
        duration:
          type: integer
          description: Duration in minutes
          example: 30
        calories:
          type: integer
          example: 250
        started:
          type: string
          description: ISO 8601 date-time
          example: "2026-10-17T08:00:00Z"
        userId:
          type: integer
          example: 1
